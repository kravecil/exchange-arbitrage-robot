[project]
name = "exchange-arbitrage-robot"
version = "0.1.0"
description = "Межбиржевой арбитражный робот на базе ccxt"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
]

[project.scripts]
arbitrage-robot = "arbitrage_robot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arbitrage_robot"]

[tool.hatch.build.targets.sdist]
include = ["src/arbitrage_robot"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
