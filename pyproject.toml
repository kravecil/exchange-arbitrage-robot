[project]
name = "arbitrage-bot"
version = "0.1.0"
description = "Professional inter-exchange crypto arbitrage bot"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
]

[project.scripts]
arb-bot = "arbitrage_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arbitrage_bot"]