# Скопируйте в config.yaml и настройте под себя.
# config.yaml добавлен в .gitignore — секреты храните в .env

# Режим работы:
#   paper — только мониторинг и вывод возможностей в консоль (без сделок)
#   live  — реальное исполнение ордеров (требуются API-ключи)
mode: paper

scanner:
  # Интервал опроса цен (секунды)
  poll_interval_seconds: 10

  # Минимальный спред для направления «вверх»:
  # покупка на бирже с более низкой ценой, продажа на бирже с более высокой
  min_spread_percent_up: 0.5

  # Минимальный спред для направления «вниз» (обратное направление)
  min_spread_percent_down: 0.5

  # Учитывать комиссии бирж при расчёте чистого спреда
  include_fees: true

  # Котировочные валюты для фильтрации пар (пустой список = все котировки)
  quote_currencies:
    - USDT
    - USDC

symbols:
  # Явный список пар для мониторинга. Пустой список = все общие пары бирж.
  include: []

  # Пары, исключённые из мониторинга
  exclude:
    - LUNA/USDT

exchanges:
  # Для арбитража нужно минимум 2 включённые биржи.
  # Можно начать с одной и добавлять остальные по мере готовности.
  - id: binance
    enabled: true

  - id: bybit
    enabled: false

  - id: okx
    enabled: false
